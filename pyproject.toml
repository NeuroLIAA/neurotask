[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotask"
version = "0.2.0"
description = "A Python package for analyzing neuropsychological tasks data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuroLIAA" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/NeuroLIAA/neurotask"

[tool.setuptools.packages.find]
where = ["neurotask"]
exclude = ["neurotask.test*"]

[tool.pytest.ini_options]
testpaths = ["neurotask/neurotask/test"]
